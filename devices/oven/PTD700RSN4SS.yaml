sensor:
  # Upper cavity
  - platform: gea
    gea_id: gea_hub
    name: Upper Set Temperature
    erd: 0x5100
    byte_offset: 1
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    icon: mdi:thermometer
  - platform: gea
    gea_id: gea_hub
    name: Lower Set Temperature
    erd: 0x5200
    byte_offset: 1
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    icon: mdi:thermometer
  - platform: gea
    gea_id: gea_hub
    name: Upper Display Temperature
    erd: 0x5109
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
  - platform: gea
    gea_id: gea_hub
    name: Upper Raw Temperature
    erd: 0x510D
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: gea
    gea_id: gea_hub
    name: Upper Probe Temperature
    erd: 0x5103
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
  - platform: gea
    gea_id: gea_hub
    name: Upper Cook Time Remaining
    erd: 0x5104
    decode: uint16_be
    multiplier: 0.0166667
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:timer-outline
  - platform: gea
    gea_id: gea_hub
    name: Upper Kitchen Timer
    erd: 0x5105
    decode: uint16_be
    multiplier: 0.0166667
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:timer-sand
  # Lower cavity
  - platform: gea
    gea_id: gea_hub
    name: Lower Display Temperature
    erd: 0x5209
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
  - platform: gea
    gea_id: gea_hub
    name: Lower Raw Temperature
    erd: 0x520D
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: gea
    gea_id: gea_hub
    name: Lower Probe Temperature
    erd: 0x5203
    decode: uint16_be
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
  - platform: gea
    gea_id: gea_hub
    name: Lower Cook Time Remaining
    erd: 0x5204
    decode: uint16_be
    multiplier: 0.0166667
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:timer-outline
  - platform: gea
    gea_id: gea_hub
    name: Lower Kitchen Timer
    erd: 0x5205
    decode: uint16_be
    multiplier: 0.0166667
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:timer-sand

binary_sensor:
  - platform: template
    name: Bus Connected
    entity_category: diagnostic
    device_class: connectivity
    lambda: 'return id(gea_hub).is_bus_connected();'
  - platform: gea
    gea_id: gea_hub
    name: Upper Probe Present
    erd: 0x5107
    bitmask: 0x01
    icon: mdi:thermometer-probe
  - platform: gea
    gea_id: gea_hub
    name: Lower Probe Present
    erd: 0x5207
    bitmask: 0x01
    icon: mdi:thermometer-probe
  - platform: gea
    gea_id: gea_hub
    name: Upper Remote Enabled
    erd: 0x510A
    bitmask: 0x01
    entity_category: diagnostic
  - platform: gea
    gea_id: gea_hub
    name: Lower Remote Enabled
    erd: 0x520A
    bitmask: 0x01
    entity_category: diagnostic
  - platform: gea
    gea_id: gea_hub
    name: Control Locked
    erd: 0x0004
    bitmask: 0x01
    device_class: lock
    icon: mdi:lock

select:
  - platform: gea
    gea_id: gea_hub
    name: Temperature Unit
    erd: 0x0007
    decode: uint8
    entity_category: config
    options:
      0x00: Fahrenheit
      0x01: Celsius
  - platform: gea
    gea_id: gea_hub
    name: Clock Format
    erd: 0x0006
    decode: uint8
    entity_category: config
    options:
      0x00: 12 Hour
      0x01: 24 Hour
      0x02: No Display
  - platform: gea
    gea_id: gea_hub
    name: End Tone
    erd: 0x5001
    decode: uint8
    entity_category: config
    options:
      0x00: Single Beep
      0x01: Repeated Beep
  - platform: gea
    gea_id: gea_hub
    name: Sound Level
    erd: 0x000A
    decode: uint8
    entity_category: config
    options:
      0x00: "Off"
      0x01: Low
      0x02: Standard
      0x03: High
  - platform: template
    name: Upper Mode
    id: up_mode
    optimistic: true
    icon: mdi:stove
    options: ["Bake", "Convection Bake", "Conv. Multi-Bake", "Convection Roast", "Air Fry"]
    initial_option: Bake
  - platform: template
    name: Lower Mode
    id: lo_mode
    optimistic: true
    icon: mdi:stove
    options: ["Bake", "Convection Bake", "Conv. Multi-Bake", "Convection Roast"]
    initial_option: Bake
  - platform: gea
    gea_id: gea_hub
    name: Upper Light
    erd: 0x5111
    decode: uint8
    icon: mdi:lightbulb
    options:
      0x00: "Off"
      0x01: High
      0x02: Dim
  - platform: gea
    gea_id: gea_hub
    name: Lower Light
    erd: 0x5211
    decode: uint8
    icon: mdi:lightbulb
    options:
      0x00: "Off"
      0x01: High
      0x02: Dim

number:
  - platform: gea
    gea_id: gea_hub
    name: Upper Temp Offset
    erd: 0x5106
    decode: int8
    min_value: -35
    max_value: 35
    step: 1
    unit_of_measurement: "°F"
    entity_category: config
    icon: mdi:plus-minus-variant
  - platform: gea
    gea_id: gea_hub
    name: Lower Temp Offset
    erd: 0x5206
    decode: int8
    min_value: -35
    max_value: 35
    step: 1
    unit_of_measurement: "°F"
    entity_category: config
    icon: mdi:plus-minus-variant
  - platform: template
    name: Upper Setpoint
    id: up_temp
    optimistic: true
    mode: box
    min_value: 300
    max_value: 500
    step: 5
    initial_value: 350
    unit_of_measurement: "°F"
    icon: mdi:thermometer
  - platform: template
    name: Lower Setpoint
    id: lo_temp
    optimistic: true
    mode: box
    min_value: 300
    max_value: 500
    step: 5
    initial_value: 350
    unit_of_measurement: "°F"
    icon: mdi:thermometer

switch:
  - platform: gea
    gea_id: gea_hub
    name: 12-Hour Shutoff
    erd: 0x5000
    entity_category: config
    icon: mdi:timer-off
  - platform: gea
    gea_id: gea_hub
    name: Convection Conversion
    erd: 0x5003
    entity_category: config
    icon: mdi:autorenew
  - platform: gea
    gea_id: gea_hub
    name: Sabbath Mode
    erd: 0x0009
    entity_category: config
    icon: mdi:candelabra

button:
  - platform: template
    name: Upper Start
    icon: mdi:play
    on_press:
      - lambda: |-
          auto idx = id(up_mode).active_index();
          uint8_t code = 1;  // Bake
          if (idx.has_value()) {
            switch (*idx) {
              case 1: code = 18; break;   // Convection Bake
              case 2: code = 27; break;   // Conv. Multi-Bake
              case 3: code = 36; break;   // Convection Roast
              case 4: code = 158; break;  // Air Fry (upper only)
            }
          }
          uint16_t t = (uint16_t)(id(up_temp).state);
          std::vector<uint8_t> p(13, 0);
          p[0] = code; p[1] = (uint8_t)(t >> 8); p[2] = (uint8_t)(t & 0xFF);
          id(gea_hub).write_erd(0x5100, p);
  - platform: template
    name: Upper Cancel
    icon: mdi:stop
    on_press:
      - lambda: 'id(gea_hub).write_erd(0x5100, std::vector<uint8_t>(13, 0));'
  - platform: template
    name: Lower Start
    icon: mdi:play
    on_press:
      - lambda: |-
          auto idx = id(lo_mode).active_index();
          uint8_t code = 1;  // Bake
          if (idx.has_value()) {
            switch (*idx) {
              case 1: code = 18; break;   // Convection Bake
              case 2: code = 27; break;   // Conv. Multi-Bake
              case 3: code = 36; break;   // Convection Roast
              case 4: code = 158; break;  // Air Fry (upper only)
            }
          }
          uint16_t t = (uint16_t)(id(lo_temp).state);
          std::vector<uint8_t> p(13, 0);
          p[0] = code; p[1] = (uint8_t)(t >> 8); p[2] = (uint8_t)(t & 0xFF);
          id(gea_hub).write_erd(0x5200, p);
  - platform: template
    name: Lower Cancel
    icon: mdi:stop
    on_press:
      - lambda: 'id(gea_hub).write_erd(0x5200, std::vector<uint8_t>(13, 0));'
  - platform: restart
    name: Restart
    entity_category: diagnostic
