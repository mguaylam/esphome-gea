# ESPHome config for a GE Profile double wall oven via GEA2 — read AND write
# Appliance: GE Profile PTD700RSN4SS (30" double electric wall oven, two cavities on one control board)
# Hardware: FirstBuild "GE Appliances Home Assistant Adapter" (Seeed XIAO ESP32-C3 on a carrier that routes the
#   appliance jack's serial line to GPIO9/GPIO10 and powers the board from the jack)
# Framework: ESP-IDF
# Baud rate: 19200 (GEA2)
# TX = GPIO9, RX = GPIO10
#
# Findings worth not rediscovering:
# - This oven is GEA2, not GEA3. GE's own adapter firmware is GEA3-only and reads garbage here (wrong baud);
#   the hub's GEA2 mode at 19200 talks to it. The control board answers at bus address 0xC0 (GE's usual);
#   it is pinned below because the hub's own discovery halts on a multi-node bus.
# - Two cavities, one board: upper oven ERDs are 0x51xx, lower oven 0x52xx, shared oven ERDs 0x00xx / 0x50xx.
# - Decoders mirror gehomesdk (simbaja/gehome), the library behind the SmartHQ cloud integration, and every
#   read here was validated byte-for-byte against SmartHQ on the same oven. Temperatures are uint16 big-endian
#   degrees F (a raw read of 75 = ambient); timers are seconds.
# - Cook mode ERD 0x5x00 is a 13-byte struct: byte 0 = mode (ErdOvenCookMode: 1 Bake, 18 Convection Bake,
#   27 Multi Bake, 36 Convection Roast, 158 Air Fry, 11/12 Broil, 0 None), bytes 1-2 = setpoint F, then cook
#   time, probe temperature, delay and two-temp fields. The upper cavity has Air Fry; the lower does not.
# - Writes proven on the board: all nine app settings (12-hour shutoff 0x5000, end tone 0x5001, convection
#   conversion 0x5003, clock format 0x0006, temperature unit 0x0007, sabbath 0x0009, sound level 0x000a,
#   per-cavity temperature offset 0x5106/0x5206 as int8 +/-35), the cavity lights 0x5111/0x5211
#   (0 Off / 1 High / 2 Dim), and mode + setpoint cook control: stage a mode and a setpoint, then the Start
#   button writes the 0x5x00 struct in one ERD write; Cancel writes mode 0. Control Lock being on did not
#   block remote writes. The bake write HEATS THE OVEN; verify with an empty cavity.
# - Not implemented: cook time and delay start (the struct fields are known, the timespan encoding was never
#   captured), and the temperature probe as a target.
esphome:
  name: ge-double-oven
  friendly_name: GE Double Oven
  comment: GE Profile PTD700RSN4SS via the FirstBuild GEA adapter
  project:
    name: GE.PTD700RSN4SS
    version: "1.0.0"
esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "ge-double-oven fallback"
    password: !secret ap_password
  on_connect:
    - output.turn_on: led_wifi
  on_disconnect:
    - output.turn_off: led_wifi
captive_portal:
logger:
  level: DEBUG
api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - output.turn_on: led_ha
    - lambda: 'id(gea_hub).log_address();'
  on_client_disconnected:
    - output.turn_off: led_ha
ota:
  - platform: esphome
    password: !secret ota_password
external_components:
  - source:
      type: local
      path: ../../components
    components: [gea]
status_led:
  pin: GPIO2
output:
  - platform: gpio
    pin: GPIO3
    id: led_ha
  - platform: gpio
    pin: GPIO4
    id: led_wifi
uart:
  id: uart_gea
  tx_pin: GPIO9
  rx_pin: GPIO10
  baud_rate: 19200
gea:
  id: gea_hub
  uart_id: uart_gea
  protocol: gea2
  dest_address: 0xC0
  poll_interval: 500ms
  erd_lookup: true

# ---- shared enums as YAML anchors ----
.oven_state_options: &oven_state_options
  0x00: "Off"
  0x01: "Preheat"
  0x02: "Preheat"
  0x03: "Preheat"
  0x04: "Preheat"
  0x05: "Bake"
  0x06: "Bake (Two Temp.)"
  0x07: "Convection Bake"
  0x08: "Convection Bake (Two Temp.)"
  0x09: "Multi Bake"
  0x0A: "Multi Bake"
  0x0B: "Convection Roast"
  0x0C: "Convection Roast (Two Temp.)"
  0x0D: "Broil (Low)"
  0x0E: "Broil (High)"
  0x0F: "Convection Broil (High)"
  0x10: "Convection Broil (Low)"
  0x11: "Convection Broil (Crisp)"
  0x12: "Keep Warm"
  0x13: "Proof"
  0x14: "Sabbath Mode"
  0x15: "Self Clean"
  0x16: "Self Clean"
  0x17: "Self Clean"
  0x18: "Self Clean"
  0x19: "Steam Clean"
  0x1A: "Steam Clean"
  0x1B: "Delayed Start"
.oven_light_options: &oven_light_options
  0x00: "Off"
  0x01: High
  0x02: Dim
  0xFF: Not Available

text_sensor:
  - platform: gea
    gea_id: gea_hub
    name: Upper State
    erd: 0x5101
    decode: uint8
    icon: mdi:stove
    options: *oven_state_options
  - platform: gea
    gea_id: gea_hub
    name: Lower State
    erd: 0x5201
    decode: uint8
    icon: mdi:stove
    options: *oven_state_options
  - platform: gea
    gea_id: gea_hub
    name: Model
    erd: 0x0001
    decode: ascii
    entity_category: diagnostic
  - platform: gea
    gea_id: gea_hub
    name: Serial Number
    erd: 0x0002
    decode: ascii
    entity_category: diagnostic
  - platform: template
    name: Bus Address
    entity_category: diagnostic
    icon: mdi:map-marker
    update_interval: 60s
    lambda: |-
      if(!id(gea_hub).is_address_resolved()) return {"unresolved"};
      char buf[8]; snprintf(buf, sizeof(buf), "0x%02X", id(gea_hub).get_dest_address());
      return {std::string(buf)};

